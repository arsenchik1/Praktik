<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>💱 Конвертер валют</h1>
            <nav>
                <button class="nav-btn active" data-page="converter">Конвертер</button>
                <button class="nav-btn" data-page="rates">Курсы валют</button>
            </nav>
        </header>

        <main>
            <!-- Страница конвертера -->
            <div id="converter-page" class="page active">
                <h2>Конвертация валюты</h2>
                
                <div class="converter-form">
                    <div class="input-group">
                        <label for="amount">Сумма:</label>
                        <input type="number" id="amount" placeholder="Введите сумму" value="100" min="0.01" step="0.01">
                    </div>

                    <div class="currency-row">
                        <div class="input-group">
                            <label for="from-currency">Из валюты:</label>
                            <select id="from-currency">
                                <!-- Будут заполнены через JS -->
                            </select>
                        </div>

                        <button id="swap-currencies" class="swap-btn">⇄</button>

                        <div class="input-group">
                            <label for="to-currency">В валюту:</label>
                            <select id="to-currency">
                                <!-- Будут заполнены через JS -->
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="text-input">Или введите текст (например: 15 usd in rub):</label>
                        <input type="text" id="text-input" placeholder="15 usd in rub">
                    </div>

                    <button id="convert-btn" class="convert-btn">Конвертировать</button>

                    <div id="result" class="result-box">
                        <!-- Результат появится здесь -->
                    </div>
                </div>
            </div>

            <!-- Страница курсов валют -->
            <div id="rates-page" class="page">
                <h2>Текущие курсы валют</h2>
                
                <div class="rates-header">
                    <div class="input-group">
                        <label for="base-currency">Базовая валюта:</label>
                        <select id="base-currency">
                            <!-- Будут заполнены через JS -->
                        </select>
                    </div>
                </div>

                <div id="rates-table" class="rates-table">
                    <!-- Таблица с курсами появится здесь -->
                </div>

                <div class="last-update" id="last-update">
                    <!-- Время последнего обновления -->
                </div>
            </div>
        </main>

        <footer>
            <p>Курсы валют обновляются каждые 60 минут. Данные предоставлены exchangerate-api.com</p>
        </footer>
    </div>

    <script src="js/currency-converter.js"></script>
</body>
</html>
