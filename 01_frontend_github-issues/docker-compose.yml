version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_GITHUB_TOKEN=${REACT_APP_GITHUB_TOKEN}
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_GITHUB_TOKEN=${REACT_APP_GITHUB_TOKEN}
    volumes:
      - ./frontend:/app
      - /app/node_modules